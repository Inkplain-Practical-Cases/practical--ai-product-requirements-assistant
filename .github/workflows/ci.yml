name: Seven-Branch Python Test Matrix
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ["main", "step-01-receive-product-requirements", "step-02-extract-requirements-and-actors", "step-03-generate-acceptance-tested-user-stories", "step-04-design-requirement-data-flows", "step-05-propose-traceable-system-design", "step-06-validate-requirements-consistency-and-ci"]
    name: ${{ matrix.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
